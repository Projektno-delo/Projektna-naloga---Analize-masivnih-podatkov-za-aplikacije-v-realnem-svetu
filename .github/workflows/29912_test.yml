name: 29912 CI/CD Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_DIR: razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website

jobs:
  test:
    name: Test website
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Namesti, testiraj in zgradi
        shell: powershell
        run: |
          $mapped = $false

          if (-not (Test-Path "W:\")) {
            subst W: "$env:GITHUB_WORKSPACE"
            $mapped = $true
            $app = "W:\$env:APP_DIR"
          } else {
            $app = Join-Path $env:GITHUB_WORKSPACE $env:APP_DIR
          }

          try {
            Set-Location $app
            npm ci
            npm test
            npm run build
          } finally {
            if ($mapped) {
              subst W: /D
            }
          }

  dockerhub:
    name: Build and push Docker image
    runs-on: [self-hosted, Windows, X64]
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Prijava v DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preveri Docker engine
        shell: powershell
        run: |
          $dockerDesktop = Join-Path $env:ProgramFiles "Docker\Docker\Docker Desktop.exe"

          if (Test-Path $dockerDesktop) {
            Start-Process $dockerDesktop
          }

          $timeout = (Get-Date).AddMinutes(3)

          do {
            docker info *> $null

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker engine je pripravljen."
              exit 0
            }

            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $timeout)

          throw "Docker engine ni zagnan. Na self-hosted runnerju zazeni Docker Desktop ali runner zazeni v uporabniski seji."

      - name: Zgradi Docker sliko
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE $env:APP_DIR
          $image = "$env:DOCKERHUB_USERNAME/hribovc-website".ToLowerInvariant()

          docker build -t "${image}:latest" -t "${image}:$env:GITHUB_SHA" $app

      - name: Objavi Docker sliko
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/hribovc-website".ToLowerInvariant()

          docker push "${image}:latest"
          docker push "${image}:$env:GITHUB_SHA"
