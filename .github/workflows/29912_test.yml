name: 29912 CI/CD Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_DIR: razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website

jobs:
  test:
    name: Test website
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Namesti, testiraj in zgradi
        shell: powershell
        run: |
          $mapped = $false

          if (-not (Test-Path "W:\")) {
            subst W: "$env:GITHUB_WORKSPACE"
            $mapped = $true
            $app = "W:\$env:APP_DIR"
          } else {
            $app = Join-Path $env:GITHUB_WORKSPACE $env:APP_DIR
          }

          try {
            Set-Location $app
            npm ci
            npm test
            npm run build
          } finally {
            if ($mapped) {
              subst W: /D
            }
          }

  dockerhub:
    name: Build and push Docker image
    runs-on: [self-hosted, Windows, X64]
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Debug DockerHub secrets
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        
        run: |
          Write-Host "Username length: $($env:DOCKERHUB_USERNAME.Length)"
          Write-Host "Token length: $($env:DOCKERHUB_TOKEN.Length)"

      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Prijava v DockerHub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if (!$env:DOCKERHUB_USERNAME -or !$env:DOCKERHUB_TOKEN) {
            throw "Manjkata secrets DOCKERHUB_USERNAME ali DOCKERHUB_TOKEN."
          }

          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

      - name: Zgradi Docker sliko
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE $env:APP_DIR
          $image = "$env:DOCKERHUB_USERNAME/hribovc-website".ToLowerInvariant()

          docker build -t "${image}:latest" -t "${image}:$env:GITHUB_SHA" $app

      - name: Objavi Docker sliko
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/hribovc-website".ToLowerInvariant()

          docker push "${image}:latest"
          docker push "${image}:$env:GITHUB_SHA"
