name: 29912 Testiranje Website

on:
  push:
    branches:
      - main

jobs:
  preveri-teste:
    name: Preveri obstoj testov
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Prenesi kodo iz repozitorija
        uses: actions/checkout@v4

      - name: Preveri, ali obstajajo testne skripte
        shell: pwsh
        run: |
          # Standardno napako preusmerimo v napaka.txt, kot zahteva naloga.
          if (!(Test-Path "razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website/tests")) {
            "Mapa tests ne obstaja." | Out-File -FilePath napaka.txt
            exit 1
          }

          $testFiles = Get-ChildItem "razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website/tests" -Filter "*.test.cjs" -ErrorAction SilentlyContinue

          if ($testFiles.Count -eq 0) {
            "Testne datoteke ne obstajajo." | Out-File -FilePath napaka.txt
            exit 1
          }

          # Ce ni napake, mora biti datoteka prazna.
          New-Item -Path napaka.txt -ItemType File -Force | Out-Null

      - name: Shrani artefakt z napakami
        uses: actions/upload-artifact@v4
        with:
          name: napaka
          path: napaka.txt

  izvedi-teste:
    name: Izvedi teste
    runs-on: [self-hosted, Windows, X64]
    needs: preveri-teste

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Prenesi kodo iz repozitorija
        uses: actions/checkout@v4

      - name: Prenesi artefakt napaka.txt iz prvega posla
        uses: actions/download-artifact@v4
        with:
          name: napaka

      - name: Preveri vsebino napaka.txt
        shell: pwsh
        run: |
          # Ce datoteka ni prazna, prekinemo izvajanje drugega posla.
          if ((Get-Item napaka.txt).Length -gt 0) {
            Get-Content napaka.txt
            exit 1
          }

      - name: Nastavi Node.js okolje
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website/package-lock.json

      - name: Namesti odvisnosti
        working-directory: razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website
        run: npm ci

      - name: Pozeni teste
        working-directory: razvoj-aplikacij-za-internet/Frontend/Hribovc/frontend/hribovc-website
        run: npm test