name: NPO CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_DIR: namenska-programska-oprema/mobilna-app

jobs:
  test:
    name: Test NPO Mobile App
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Namesti odvisnosti
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Preveri ESLint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      - name: Preveri TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit
