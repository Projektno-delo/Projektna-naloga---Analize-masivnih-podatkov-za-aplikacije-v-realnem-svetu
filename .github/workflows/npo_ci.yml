name: NPO CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_DIR: namenska-programska-oprema/mobilna-app

jobs:
  test:
    name: Test NPO Mobile App
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Nastavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Namesti odvisnosti
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Preveri ESLint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint
      - name: Preveri TypeScript
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

  dockerhub:
    name: Build and push Docker image
    runs-on: [self-hosted, Windows, X64]
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Prenesi kodo
        uses: actions/checkout@v4

      - name: Prijava v DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ANJA }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ANJA }}
          
      - name: Preveri Docker engine
        shell: powershell
        run: docker info

      - name: Zgradi Docker sliko
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "namenska-programska-oprema/mobilna-app"
          docker build -t anja21docker/npo-mobile-app:latest $app

      - name: Objavi Docker sliko
        shell: powershell
        run: |
          docker push anja21docker/npo-mobile-app:latest
