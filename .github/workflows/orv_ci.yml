name: ORV CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "osnove-racunalniskega-vida/**"
      - ".github/workflows/orv_ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "osnove-racunalniskega-vida/**"
      - ".github/workflows/orv_ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: osnove-racunalniskega-vida
  IMAGE_NAME: hribovc-orv-api
  LOCAL_IMAGE: hribovc-orv-api-ci

jobs:
  test:
    name: Test ORV API
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Omogoci dolge poti v Gitu
        shell: powershell
        run: git config --global core.longpaths true

      - name: Prenesi kodo
        uses: actions/checkout@v6

      - name: Preveri Docker engine
        shell: powershell
        run: |
          $dockerDesktop = Join-Path $env:ProgramFiles "Docker\Docker\Docker Desktop.exe"

          docker info *> $null

          if ($LASTEXITCODE -ne 0 -and (Test-Path $dockerDesktop)) {
            Start-Process $dockerDesktop -WindowStyle Hidden
          }

          $timeout = (Get-Date).AddMinutes(3)

          do {
            docker info *> $null

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker engine je pripravljen."
              exit 0
            }

            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $timeout)

          throw "Docker engine ni zagnan ali runner nima dostopa do njega."

      - name: Zgradi ORV Docker sliko
        shell: powershell
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE $env:APP_DIR
          $image = "$env:LOCAL_IMAGE`:$env:GITHUB_SHA".ToLowerInvariant()

          docker build -t $image $app

          if ($LASTEXITCODE -ne 0) {
            throw "Izdelava ORV Docker slike ni uspela."
          }

      - name: Zazeni ORV API teste
        shell: powershell
        run: |
          $image = "$env:LOCAL_IMAGE`:$env:GITHUB_SHA".ToLowerInvariant()

          docker run --rm $image `
            python -m pytest `
            tests/test_api_health.py `
            tests/test_api_threshold_validation.py `
            tests/test_api_no_face_response.py `
            -q

          if ($LASTEXITCODE -ne 0) {
            throw "ORV API testi niso uspeli."
          }

      - name: Preveri delovanje ORV API vsebnika
        shell: powershell
        run: |
          $image = "$env:LOCAL_IMAGE`:$env:GITHUB_SHA".ToLowerInvariant()
          $container = "hribovc-orv-api-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback,
            0
          )

          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()

          docker run -d `
            --name $container `
            -p "127.0.0.1:${port}:8000" `
            $image

          if ($LASTEXITCODE -ne 0) {
            throw "ORV API Docker vsebnika ni bilo mogoce zagnati."
          }

          try {
            $timeout = (Get-Date).AddMinutes(2)
            $healthy = $false

            do {
              try {
                $response = Invoke-RestMethod `
                  -Uri "http://127.0.0.1:$port/health" `
                  -Method Get `
                  -TimeoutSec 5

                if ($response.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 5
              }
            } while ((Get-Date) -lt $timeout)

            if (-not $healthy) {
              docker logs $container
              throw "ORV API health check ni uspel."
            }

            Write-Host "ORV API Docker health check je uspel."
          } finally {
            docker rm -f $container 2>$null
          }

      - name: Prijava v DockerHub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Objavi ORV Docker sliko
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $localImage = "$env:LOCAL_IMAGE`:$env:GITHUB_SHA".ToLowerInvariant()
          $dockerHubImage = "$env:DOCKERHUB_USERNAME/$env:IMAGE_NAME".ToLowerInvariant()

          docker tag $localImage "${dockerHubImage}:latest"
          docker tag $localImage "${dockerHubImage}:$env:GITHUB_SHA"

          docker push "${dockerHubImage}:latest"
          docker push "${dockerHubImage}:$env:GITHUB_SHA"

          if ($LASTEXITCODE -ne 0) {
            throw "Objava ORV Docker slike ni uspela."
          }

      - name: Pocisti lokalno CI sliko
        if: always()
        shell: powershell
        run: |
          $image = "$env:LOCAL_IMAGE`:$env:GITHUB_SHA".ToLowerInvariant()
          docker image rm -f $image 2>$null